surface_sites_model_type: Monodisperse
surface_sites_model_type: ConstantSites
PAH_growth_model_type: HybridDimerization
PAH_growth_model:
  submodel_type_names: [ReactiveDimerization, "EBridgeModified"]
  ReactiveDimerization:
    inception_prefactor: 0.01
    adsorption_prefactor : 0.1
    precursor_names : [A2, A3, A4]
  EBridgeModified:
    inception_prefactor: 0.001
    adsorption_prefactor : 0.5
    precursor_names : [A2R5, A3R5, A4R5]
carbonization_enaled : True
carbonization_model:
    A_carb : 6.0e8
    Ea_carb : 2.05e5